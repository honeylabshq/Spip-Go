name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        # Read the version from go.mod rather than repeating it here.
        # setup-go sets GOTOOLCHAIN=local when it installs a pinned version, so
        # a toolchain older than the `go` directive is a hard failure and not a
        # silent download. go.mod went to 1.25.0 in a50425d while this still
        # said '1.24', and main went red with "go.mod requires go >= 1.25.0
        # (running go 1.24.13; GOTOOLCHAIN=local)". Two places holding one
        # version is what drifted; now there is one.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o spip-agent ./cmd/spip-agent

      - name: Run unit tests
        run: |
          go test ./internal/... ./pkg/... -v -race -coverprofile=coverage.txt -covermode=atomic

      - name: Setup for E2E tests
        run: |
          sudo apt-get update
          sudo apt-get install -y iptables
          # Create test directories with proper permissions
          sudo mkdir -p /tmp/spip-test /tmp/spip-test-tls
          sudo chmod 777 /tmp/spip-test /tmp/spip-test-tls
          # Allow the test user to use iptables without password
          echo "runner ALL=(ALL) NOPASSWD: /usr/sbin/iptables" | sudo tee /etc/sudoers.d/runner-iptables
          echo "runner ALL=(ALL) NOPASSWD: /sbin/iptables" | sudo tee -a /etc/sudoers.d/runner-iptables

      - name: Run E2E tests
        run: |
          cd test/e2e
          sudo -E go test -v -race -tags=e2e ./... 